<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Region Crop Screen Snipping Tool</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    button { padding: 12px 24px; font-size: 15px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
    .btn-start { background: #007bff; color: white; }
    .btn-crop { background: #28a745; color: white; }
    .btn-crop:disabled { background: #444; cursor: not-allowed; }
    
    /* Fullscreen Snipping Overlay */
    #overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5); cursor: crosshair; z-index: 9999;
    }
    #selectionBox {
      border: 2px dashed #00ffcc; background: rgba(0, 255, 204, 0.15);
      position: absolute; display: none; pointer-events: none;
    }
    
    #previewContainer { margin-top: 20px; border: 1px solid #444; padding: 10px; display: inline-block; background: #000; border-radius: 8px; }
    canvas { max-width: 100%; height: auto; }
  </style>
</head>
<body>

  <h2>Interactive Region Snipping Tool</h2>
  <p>Stream your target tab or screen, then drag a crop box to snap any exact region!</p>

  <button class="btn-start" onclick="startStream()">1. START SCREEN SCAN</button>
  <button id="cropBtn" class="btn-crop" onclick="openSnipper()" disabled>2. CAPTURE & CROP AREA</button>

  <video id="hiddenVideo" autoplay style="display:none;"></video>

  <div id="overlay">
    <div id="selectionBox"></div>
  </div>

  <div id="previewContainer">
    <h3>Selected Region Snapshot:</h3>
    <canvas id="outputCanvas"></canvas>
    <br><br>
    <button id="downloadBtn" class="btn-crop" onclick="downloadSnap()" style="display:none;">DOWNLOAD REGION (.PNG)</button>
  </div>

  <script>
    const video = document.getElementById('hiddenVideo');
    const cropBtn = document.getElementById('cropBtn');
    const overlay = document.getElementById('overlay');
    const selectionBox = document.getElementById('selectionBox');
    const outputCanvas = document.getElementById('outputCanvas');
    const downloadBtn = document.getElementById('downloadBtn');

    let startX, startY, endX, endY;
    let isSelecting = false;

    // 1. Connect Screen Feed
    async function startStream() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "monitor" } });
        video.srcObject = stream;
        cropBtn.disabled = false;
        alert("Screen connected! Click 'CAPTURE & CROP AREA' to drag and select your crop region.");
      } catch (err) {
        alert("Screen stream permission is required for the drag cursor to select areas.");
      }
    }

    // 2. Open Drag Overlay
    function openSnipper() {
      if (!video.srcObject) return;
      overlay.style.display = 'block';
    }

    // 3. Drag Selection Mouse Events
    overlay.addEventListener('mousedown', (e) => {
      isSelecting = true;
      startX = e.clientX;
      startY = e.clientY;
      selectionBox.style.left = `${startX}px`;
      selectionBox.style.top = `${startY}px`;
      selectionBox.style.width = '0px';
      selectionBox.style.height = '0px';
      selectionBox.style.display = 'block';
    });

    overlay.addEventListener('mousemove', (e) => {
      if (!isSelecting) return;
      endX = e.clientX;
      endY = e.clientY;

      const width = Math.abs(endX - startX);
      const height = Math.abs(endY - startY);
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);

      selectionBox.style.width = `${width}px`;
      selectionBox.style.height = `${height}px`;
      selectionBox.style.left = `${left}px`;
      selectionBox.style.top = `${top}px`;
    });

    overlay.addEventListener('mouseup', () => {
      if (!isSelecting) return;
      isSelecting = false;
      overlay.style.display = 'none';
      selectionBox.style.display = 'none';

      cropAndRenderRegion();
    });

    // 4. Crop Exact Region to Canvas
    function cropAndRenderRegion() {
      const rectLeft = Math.min(startX, endX);
      const rectTop = Math.min(startY, endY);
      const rectWidth = Math.abs(endX - startX);
      const rectHeight = Math.abs(endY - startY);

      if (rectWidth < 10 || rectHeight < 10) return; // Prevent accidental tiny clicks

      // Scale coordinates to match actual video stream dimensions
      const scaleX = video.videoWidth / window.innerWidth;
      const scaleY = video.videoHeight / window.innerHeight;

      outputCanvas.width = rectWidth * scaleX;
      outputCanvas.height = rectHeight * scaleY;

      const ctx = outputCanvas.getContext('2d');
      ctx.drawImage(
        video,
        rectLeft * scaleX, rectTop * scaleY, rectWidth * scaleX, rectHeight * scaleY, // Source crop
        0, 0, outputCanvas.width, outputCanvas.height // Canvas target
      );

      downloadBtn.style.display = 'inline-block';
    }

    // 5. Save Captured PNG
    function downloadSnap() {
      const link = document.createElement('a');
      link.download = `RegionSnap_${Date.now()}.png`;
      link.href = outputCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
